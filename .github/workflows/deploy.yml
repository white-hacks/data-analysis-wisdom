# =============================================================================
# Build, test and publish The Tableau Repo to GitHub Pages
# =============================================================================
# - Every push and pull request: run the tests, validate content, build.
# - Pushes to the default branch (main): also publish _site to GitHub Pages,
#   served at the custom domain in src/CNAME (thetableaurepo.com).
#
# One-time setup in GitHub: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". See README.md for the DNS records.
# =============================================================================
name: Build and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate content
        run: npm run validate

      - name: Build site
        run: npm run build

      - name: Upload site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
