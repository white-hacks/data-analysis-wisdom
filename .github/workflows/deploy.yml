# =============================================================================
# Build, test and publish The Tableau Repo to GitHub Pages
# =============================================================================
# - Every push (to any branch, including pull request branches): unit
#   tests, content validation, build, checks on the built pages, and
#   browser tests in Chromium.
# - Pushes to `main`: also publish _site to GitHub Pages, served at the
#   custom domain in src/CNAME (thetableaurepo.com). Other branches only
#   build and test, so work in progress never goes live.
#
# One-time setup in GitHub: Settings → Pages → Build and deployment →
# Source: "GitHub Actions", then Custom domain: thetableaurepo.com
# (Actions deployments ignore the CNAME file). See README.md for DNS.
# =============================================================================
name: Build and deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels an older run, except on main,
# where a deployment that has started is allowed to finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate content
        run: npm run validate

      - name: Build site
        run: npm run build

      - name: Check built pages (links, anchors, headings, alt text)
        run: npm run check:site

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests (menu, layout at 5 widths, 404)
        run: npm run test:e2e

      - name: Upload site for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
