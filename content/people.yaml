# =============================================================================
# people.yaml: featured experts shown on the Visualizations pages
# =============================================================================
# Each person gets a page at /visualizations/<slug>/ with a gallery of their
# Tableau Public vizzes. The gallery data lives in content/vizzes.json and is
# refreshed with:
#     npm run fetch:vizzes
#
# HOW TO ADD SOMEONE
#   1. Add an entry below (order here = order on the site and in the menu).
#   2. Run `npm run fetch:vizzes -- --only <slug>` to download their vizzes.
#   3. Use the same spelling of their name in articles.yaml / quotes.yaml so
#      their articles and quotes link to their page automatically.
#
# FIELDS
#   slug           URL-safe id for their page.
#   name           Display name (must match the spelling used in articles).
#   tableauPublic  Their Tableau Public profile URL (…/app/profile/<name>).
#   website        Optional personal or company site.
#   affiliation    Short line under the name.
#   bio            One or two sentences, written by us from public sources.
# =============================================================================

