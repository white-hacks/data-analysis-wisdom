# =============================================================================
# quotes.yaml: short, memorable statements taken word for word from the
# articles listed in articles.yaml
# =============================================================================
# Every quote must appear VERBATIM in its source article. Run
#   npm run verify:quotes
# to re-check them against the live pages (see scripts/verify-quotes.js).
#
# FIELDS
#   text     The exact words from the article. Use a leading or trailing "…"
#            when the quote starts or ends mid-sentence.
#   author   The person (or organisation) who said or wrote it.
#   article  The `id` of the source article in articles.yaml. The quote card
#            links to that article.
#   topic    Optional "<category>/<subcategory>" (or "miscellaneous") where the
#            quote is shown. Defaults to the article's first placement.
#
# Quotes are grouped on the Short quotes pages by topic, in file order.
# =============================================================================

