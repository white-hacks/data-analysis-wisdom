# =============================================================================
# articles.yaml: every article listed on the site
# =============================================================================
# Each article is stored ONCE and placed on as many topic pages as it belongs
# to via `placements`. This is how an article that the research guide lists in
# several subcategories appears on every one of those pages.
#
# FIELDS
#   id          Unique, URL-safe id. Quotes refer to articles by this id.
#   title       Article title as published.
#   authors     List of author names (display strings). Use the exact spelling
#               used in people.yaml to link the name to a Visualizations page.
#   publisher   Site or organisation that publishes the article.
#   url         Link to the original article (the site never copies articles).
#   published   Optional publication date: "YYYY", "YYYY-MM" or "YYYY-MM-DD".
#   summary     One or two sentences describing the article.
#   caveat      Optional warning shown on the card (e.g. login prompts).
#   placements  Where the article appears. Each entry has:
#     topic     "<category-slug>/<subcategory-slug>" (or just "miscellaneous")
#     section   Optional section slug declared in categories.yaml
#     note      Optional context shown only on that topic page (why the
#               article matters there).
#
# Order within a topic page follows the order of this file.
# =============================================================================

# -----------------------------------------------------------------------------
# From the research guide
# -----------------------------------------------------------------------------

